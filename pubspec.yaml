name: singing_app

description: "A new Flutter project."

publish_to: "none"

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  go_router: ^14.6.0
  injectable: ^2.5.0
  get_it: ^8.0.2
  intl: ^0.20.1
  flutter_bloc: ^9.0.0
  collection: ^1.18.0
  auto_size_text: ^3.0.0
  shimmer: ^3.0.0
  equatable: ^2.0.5
  path_provider: ^2.1.5
  audioplayers: ^6.2.0
  wav: ^1.3.0
  ffmpeg_kit_flutter: ^6.0.3
  permission_handler: ^11.4.0
  ffi: ^2.1.3
  record: ^5.2.1
  flutter_sound: ^9.26.0
  just_audio: ^0.9.46

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^5.0.0
  injectable_generator: ^2.6.2
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true

  assets:
    - assets/vocals/HEALTH_CHECK.mp3
    - assets/vocals/MIA_MIA_MIA.mp3
    - assets/vocals/SUSTAINED_DESCENDING.mp3
    - assets/vocals/sample-3s.wav
    - assets/vocals/sample-12s.wav    
    - assets/vocals/sample-15s.wav
